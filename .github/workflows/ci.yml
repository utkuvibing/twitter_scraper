name: CI

on:
  push:
    branches: [main, prod-ready, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and release tools
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile runtime modules
        run: >-
          python -m compileall -q chrome_auth.py config.py diagnostics.py
          document_generator.py export_schema.py main.py run_models.py scraper.py
          terminal_ui.py time_utils.py version.py x_scraper_cli.py

      - name: Lint
        run: python -m ruff check .

      - name: Verify formatting
        run: python -m ruff format --check .

      - name: Type check browser-free core
        run: python -m mypy

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke test the installed wheel
        run: python scripts/wheel_smoke.py

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
