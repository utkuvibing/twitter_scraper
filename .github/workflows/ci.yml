name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r python_sidecar/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python modules
        run: python -m compileall main.py scraper.py document_generator.py export_schema.py diagnostics.py python_sidecar

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check Tauri crate
        working-directory: src-tauri
        run: |
          set +e
          cargo check --locked 2>&1 | tee cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### cargo check failed"
              echo '```text'
              tail -n 120 cargo-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail_line=$(tail -n 40 cargo-check.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/"/'\''/g')
            echo "::error title=cargo check failed::$tail_line"
          fi
          exit "$status"
