[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "x-scraper-cli"
dynamic = ["version"]
description = "A personal, authorized X/Twitter archival CLI built with Selenium"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "utkuvibing" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
  "selenium>=4.15,<5",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/utkuvibing/twitter_scraper"
Repository = "https://github.com/utkuvibing/twitter_scraper"
Issues = "https://github.com/utkuvibing/twitter_scraper/issues"

[project.scripts]
x-scraper = "main:main"

[tool.setuptools]
py-modules = [
  "config",
  "chrome_auth",
  "diagnostics",
  "document_generator",
  "export_schema",
  "main",
  "scraper",
  "terminal_ui",
  "time_utils",
  "run_models",
  "version",
  "x_scraper_cli",
]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".sessions", ".venv", "build", "dist", "docs/superpowers", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
exclude = '(^|[\\/])(\.venv|build|dist|output|\.sessions)([\\/]|$)'
files = [
  "chrome_auth.py",
  "diagnostics.py",
  "export_schema.py",
  "run_models.py",
  "time_utils.py",
  "version.py",
  "x_scraper_cli.py",
]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
